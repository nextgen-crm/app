<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NextGen CRM | Team Dashboard</title>
    
    <!-- Dependencies (Using CDNs for functionality) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- Config -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd',
                400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8',
              }
            },
            animation: { 'slide-up': 'slideUp 0.3s ease-out forwards', 'fade-in': 'fadeIn 0.3s ease-out forwards' },
            keyframes: {
              slideUp: { '0%': { transform: 'translateY(100%)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } }
            }
          }
        }
      }
    </script>

    <style>
      /* Hide Scrollbars */
      ::-webkit-scrollbar { display: none; }
      * { -ms-overflow-style: none; scrollbar-width: none; }
      
      body { 
          background-color: #f8fafc; 
          -webkit-tap-highlight-color: transparent; 
          overscroll-behavior-y: none; 
          font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }

      /* SortableJS Classes */
      .sortable-ghost { opacity: 0.4; background: #eff6ff; border: 2px dashed #3b82f6; }
      
      /* Disable selection globally during active drag */
      body.dragging-active, body.dragging-active * {
          user-select: none !important;
          -webkit-user-select: none !important;
          -moz-user-select: none !important;
          -ms-user-select: none !important;
      }
      
      /* Dragging visual feedback */
      .sortable-drag { 
          cursor: grabbing; 
          opacity: 1; 
          background: white; 
          transform: rotate(3deg) scale(1.02); 
          box-shadow: 0 20px 25px -5px rgba(0,0,0,0.2) !important; 
          z-index: 9999 !important; 
      }
      
      /* Snap scrolling for Kanban */
      .snap-x-mandatory {
          scroll-snap-type: x mandatory;
      }
      .snap-center {
          scroll-snap-align: center;
          scroll-snap-stop: always; /* Ensure we stop exactly on a column */
      }

      /* Disable snap and smoothing during drag to allow JS auto-scroll */
      .no-snap {
          scroll-snap-type: none !important;
          scroll-behavior: auto !important;
      }
      
      .chat-bubble { animation: fadeIn 0.3s ease-out forwards; }
      
      .sync-spin { animation: spin 2s linear infinite; }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-slate-900 selection:bg-blue-100 selection:text-blue-900">

    <div id="app" class="flex flex-col h-screen">
        
        <!-- Header -->
        <header class="h-20 md:h-24 bg-slate-50/90 backdrop-blur-md flex items-center justify-between px-4 md:px-8 shrink-0 z-10 sticky top-0 border-b border-slate-100 transition-all">
            <div class="flex items-center">
                <img src="Logo2.png" class="h-auto max-h-[45px] md:max-h-[60px] w-auto" alt="NextGee">
            </div>
            
            <div class="flex items-center gap-3 md:gap-4">
                <!-- Sync Button -->
                <button onclick="fetchLeadsFromSheets()" id="sync-btn" class="flex items-center gap-2 px-3 py-2 text-xs font-bold bg-white text-blue-600 border border-blue-100 rounded-lg hover:bg-blue-50 transition-all shadow-sm">
                    <i data-lucide="refresh-cw" id="sync-icon" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">Refresh Data</span>
                </button>
                <button onclick="toggleMenu()" class="p-2 hover:bg-slate-100 rounded-xl transition-all active:scale-90 flex md:hidden">
                    <i data-lucide="menu" class="w-6 h-6 text-slate-700"></i>
                </button>
            </div>
        </header>

        <!-- Sidebar (Desktop) -->
        <aside class="hidden md:flex flex-col fixed left-0 top-24 bottom-0 w-64 bg-slate-50 border-r border-slate-200/50 p-4 z-20">
            <div class="space-y-1 flex-1 animate-fade-in" id="desktop-nav">
                <!-- Nav items rendered by JS -->
            </div>
            <!-- Profile Section -->
            <div id="desktop-profile" class="mt-auto border-t border-slate-200/50 pt-4 pb-2 px-2 flex items-center gap-3 cursor-pointer hover:bg-slate-100/60 rounded-xl transition-all" onclick="openProfileModal()">
                <img src="CRM USER LOGO.jpg" id="profile-avatar-img" class="w-10 h-10 rounded-full object-cover border-2 border-white shadow-sm shrink-0" alt="Profile">
                <div class="overflow-hidden">
                    <p id="profile-name-text" class="text-sm font-bold text-slate-700 truncate">Admin User</p>
                    <p id="profile-role-text" class="text-[10px] font-semibold text-slate-400 uppercase truncate">Administrator</p>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main id="main-content" class="flex-1 overflow-y-auto overflow-x-hidden relative scroll-smooth md:ml-64">
            <!-- Content rendered by JS -->
        </main>

        <!-- Bottom Navigation (Mobile) -->
        <nav class="md:hidden h-16 bg-white border-t border-slate-200 flex justify-around items-center shrink-0 pb-safe shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.02)] z-30" id="mobile-nav">
            <!-- Nav items rendered by JS -->
        </nav>

        <!-- Drawer Menu (Mobile & More) -->
        <div id="side-menu" class="fixed inset-0 z-[60] hidden overflow-hidden pointer-events-none">
            <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm pointer-events-auto transition-opacity duration-300 opacity-0" id="menu-overlay" onclick="toggleMenu()"></div>
            <div class="absolute top-0 right-0 h-full w-72 bg-white shadow-2xl pointer-events-auto transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col" id="menu-content">
                <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/30">
                    <div>
                        <h3 class="font-black text-xl text-slate-800 tracking-tight">Workspace</h3>
                        <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-0.5"></p>
                    </div>
                    <button onclick="toggleMenu()" class="p-2 hover:bg-red-50 text-slate-400 hover:text-red-500 rounded-full transition-all active:scale-95"><i data-lucide="x" class="w-5 h-5"></i></button>
                </div>
                <div class="flex-1 py-6 px-4 space-y-6 overflow-y-auto" id="side-menu-items">
                    <!-- Items injected by JS -->
                </div>
                <div class="p-6 border-t border-slate-150 bg-slate-50/50 flex items-center gap-3 cursor-pointer hover:bg-slate-100/60 rounded-xl transition-all" onclick="toggleMenu(); openProfileModal()">
                    <img src="CRM USER LOGO.jpg" id="profile-avatar-img-mobile" class="w-10 h-10 rounded-full object-cover border-2 border-white shadow-sm shrink-0" alt="Profile">
                    <div class="overflow-hidden text-left flex-1">
                        <p id="profile-name-text-mobile" class="text-sm font-bold text-slate-700 truncate">Admin User</p>
                        <p id="profile-role-text-mobile" class="text-[10px] font-semibold text-slate-400 uppercase truncate">Administrator</p>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Agent Floating Button -->
    <button onclick="openAgentModal()" class="fixed bottom-24 md:bottom-10 left-4 md:left-[280px] bg-slate-900 text-white p-3 rounded-full shadow-xl hover:bg-slate-800 transition-transform active:scale-95 z-40 flex items-center justify-center group">

    </button>

    <!-- MODALS -->

    <!-- Agent Modal -->
    <div id="agent-modal" class="hidden fixed inset-0 z-50 flex items-end md:items-center justify-center">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity" onclick="closeModal('agent-modal')"></div>
        <div class="relative bg-white w-full md:max-w-md md:rounded-2xl rounded-t-3xl shadow-2xl flex flex-col animate-slide-up h-[80vh] md:h-[70vh]">

                <div class="flex items-center gap-3">

                    <div>
                        <h2 class="text-lg font-bold text-gray-800">Jerry</h2>
                        <div class="flex items-center gap-1.5">

                        </div>

                </div>

                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50/50" id="agent-chat-area"></div>

            <div class="p-4 bg-white border-t border-gray-100 pb-safe">

                    <button onclick="resetAgentOptions()" class="text-[10px] text-blue-600 font-bold hover:underline">Main Menu</button>
                </div>

            </div>

    </div>

    <!-- Lead Details Modal -->
    <div id="lead-modal" class="fixed inset-0 z-50 flex items-end md:items-center justify-center hidden">
        <div class="absolute inset-0 bg-slate-900/20 backdrop-blur-sm transition-opacity" onclick="closeModal('lead-modal')"></div>
        <div class="relative bg-white w-full md:max-w-lg md:rounded-2xl rounded-t-3xl shadow-2xl flex flex-col animate-slide-up h-[92vh] md:h-auto md:max-h-[85vh]">
            <div class="md:hidden w-full flex justify-center pt-3 pb-1" onclick="closeModal('lead-modal')">
                <div class="w-12 h-1.5 bg-gray-200 rounded-full"></div>
            </div>
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-50">
                <h2 class="text-xl font-bold text-gray-800 tracking-tight">Lead Profile</h2>
                <button onclick="closeModal('lead-modal')" class="p-2 bg-gray-50 hover:bg-blue-50 text-gray-500 hover:text-blue-600 rounded-full transition-colors">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div class="overflow-y-auto p-6 flex-1 bg-white" id="lead-modal-content"></div>
        </div>
    </div>

    <!-- Profile Details Modal -->
    <div id="profile-modal" class="fixed inset-0 z-[100] flex items-center justify-center hidden">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-md transition-opacity" onclick="closeModal('profile-modal')"></div>
        <div class="relative bg-white w-full max-w-sm rounded-3xl shadow-2xl p-8 flex flex-col items-center text-center animate-slide-up mx-4 border border-slate-100">
            <button onclick="closeModal('profile-modal')" class="absolute top-4 right-4 p-2 hover:bg-slate-100 rounded-full text-slate-400 hover:text-slate-600 transition-colors">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            
            <div class="w-32 h-32 md:w-36 md:h-36 rounded-full overflow-hidden border-4 border-slate-50 shadow-xl mb-6 relative">
                <img src="CRM USER LOGO.jpg" id="modal-avatar-img" class="w-full h-full object-cover" alt="Profile Avatar">
            </div>
            
            <span id="modal-profile-role" class="text-xs font-extrabold uppercase tracking-widest text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full mb-2">Administrator</span>
            <h3 id="modal-profile-name" class="text-2xl font-black text-slate-800 tracking-tight leading-none mb-1">Admin User</h3>
            <p id="modal-profile-email" class="text-slate-400 text-sm font-medium mb-8">admin@solocrm.com</p>
            
            <button onclick="handleLogout()" class="w-full bg-red-600 text-white font-black py-4 rounded-2xl shadow-lg shadow-red-100 hover:bg-red-700 active:scale-95 transition-all flex items-center justify-center gap-2 uppercase tracking-widest text-xs">
                <i data-lucide="log-out" class="w-4 h-4"></i> Logout

        </div>
    </div>

    <!-- Add Lead Modal -->
    <div id="add-modal" class="hidden fixed inset-0 z-50 flex items-end md:items-center justify-center">
        <div class="absolute inset-0 bg-slate-900/20 backdrop-blur-sm transition-opacity" onclick="closeModal('add-modal')"></div>
        <div class="relative bg-white w-full md:max-w-lg md:rounded-2xl rounded-t-3xl shadow-2xl flex flex-col animate-slide-up h-auto pb-6">
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-50">
                <h2 class="text-xl font-bold text-gray-800">New Lead</h2>
                <button onclick="closeModal('add-modal')" class="p-2 bg-gray-50 hover:bg-red-50 text-gray-500 hover:text-red-600 rounded-full">
                    <i data-lucide="x"></i>
                </button>
            </div>
            
            <div class="flex border-b border-gray-100 px-6">
                <button id="tab-manual" class="flex-1 py-4 text-sm font-bold text-blue-600 border-b-2 border-blue-600 transition-colors" onclick="switchTab('manual')">Manual Entry</button>
                <button id="tab-import" class="flex-1 py-4 text-sm font-bold text-slate-400 border-b-2 border-transparent hover:text-slate-600 transition-colors" onclick="switchTab('import')">Import Excel</button>
            </div>

            <div class="p-6">
                <!-- Manual Form -->
                <form id="add-lead-form" class="space-y-4">
                    <div class="relative">
                        <i data-lucide="user" class="absolute left-3 top-3.5 text-slate-400 w-4 h-4"></i>

                    </div>
                    <div class="relative">
                        <i data-lucide="briefcase" class="absolute left-3 top-3.5 text-slate-400 w-4 h-4"></i>
                        <input name="company" class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-4 py-3 focus:ring-2 focus:ring-blue-100 outline-none" placeholder="Company Name">
                    </div>
                    <div class="relative">
                        <i data-lucide="tag" class="absolute left-3 top-3.5 text-slate-400 w-4 h-4"></i>
                        <select name="category" id="cat-select" required class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-10 py-3 focus:ring-2 focus:ring-blue-100 outline-none appearance-none cursor-pointer font-bold text-slate-700">
                            <!-- Categories populated by JS -->
                        </select>
                        <i data-lucide="chevron-down" class="absolute right-3 top-3.5 text-slate-400 w-4 h-4 pointer-events-none"></i>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="relative">
                            <i data-lucide="phone" class="absolute left-3 top-3.5 text-slate-400 w-4 h-4"></i>
                            <input name="phone" type="tel" class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-4 py-3 focus:ring-2 focus:ring-blue-100 outline-none" placeholder="Phone">

                            <i data-lucide="mail" class="absolute left-3 top-3.5 text-slate-400 w-4 h-4"></i>
                            <input name="email" type="email" class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-10 pr-4 py-3 focus:ring-2 focus:ring-blue-100 outline-none" placeholder="Email">

                    <button type="submit" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 mt-2 shadow-lg shadow-blue-200 flex justify-center items-center gap-2 transition-all">

                    </button>
                </form>

                <div id="import-form" class="hidden space-y-5 animate-fade-in">
                    <div class="border-2 border-dashed border-blue-200 rounded-2xl p-8 text-center bg-blue-50/50 relative group transition-colors hover:bg-blue-50">
                        <input type="file" id="excel-upload" accept=".xlsx, .xls, .csv" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" onchange="handleFileUpload(this)">
                        <div class="pointer-events-none">
                            <div class="bg-white w-16 h-16 rounded-full shadow-sm flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform">
                                <i data-lucide="upload-cloud" class="w-8 h-8 text-blue-500"></i>
                            </div>
                            <p class="text-base font-bold text-slate-800">Click to Upload Excel</p>
                            <p class="text-xs text-slate-500 mt-2">Supports .xlsx, .xls, .csv</p>
                        </div>
                    </div>
                    
                    <div id="import-preview" class="hidden bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
                        <div class="flex justify-between items-center mb-4">
                            <div class="flex items-center gap-3">
                                <div class="bg-emerald-100 text-emerald-600 p-2 rounded-lg">
                                    <i data-lucide="file-spreadsheet"></i>
                                </div>
                                <div>
                                    <p class="font-bold text-slate-800 text-sm">File Ready</p>
                                    <p class="text-xs text-slate-500">Found <span id="import-count" class="font-bold text-emerald-600">0</span> leads</p>
                                </div>
                            </div>
                        </div>
                        <button onclick="confirmImport()" class="w-full bg-emerald-500 text-white font-bold py-3 rounded-xl hover:bg-emerald-600 shadow-lg shadow-emerald-200 flex items-center justify-center gap-2 transition-transform active:scale-95">

                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- LOGIC -->
    <script>
        const GAS_DEPLOY_URL = "https://script.google.com/macros/s/AKfycbyulehy_0wjkDnX7meNWLxFyheokQ-UVaYihWB43w1ZJt_Mu2E61wmJv1cEqxQw2Bj3Hw/exec";

        const LeadStatus = {
            NEW: 'New', CONTACTED: 'Contacted', FOLLOW_UP: 'Follow-Up', 
            INTERESTED: 'Interested', WON: 'Won', LOST: 'Lost'
        };
        const InteractionType = { CALL: 'Call', WHATSAPP: 'WhatsApp', EMAIL: 'Email', NOTE: 'Note' };
        
        const COLUMNS = [
            { id: LeadStatus.NEW, title: 'New' }, { id: LeadStatus.CONTACTED, title: 'Contacted' },
            { id: LeadStatus.FOLLOW_UP, title: 'Follow Up' }, { id: LeadStatus.INTERESTED, title: 'Interested' },
            { id: LeadStatus.WON, title: 'Won' }, { id: LeadStatus.LOST, title: 'Lost' }
        ];

        class Database {
            constructor() {
                this.KEYS = { 
                    LEADS: 'solocrm_leads', 
                    TASKS: 'solocrm_tasks', 
                    INTERACTIONS: 'solocrm_interactions', 
                    CLIENTS: 'solocrm_clients', 
                    CATEGORIES: 'solocrm_categories',
                    FOLLOWUPS: 'solocrm_followups',
                    TEMPLATES: 'solocrm_templates'
                };
                this.init();
            }
            init() {
                if (!localStorage.getItem(this.KEYS.LEADS)) localStorage.setItem(this.KEYS.LEADS, JSON.stringify([]));
                if (!localStorage.getItem(this.KEYS.TASKS)) localStorage.setItem(this.KEYS.TASKS, JSON.stringify([]));
                if (!localStorage.getItem(this.KEYS.INTERACTIONS)) localStorage.setItem(this.KEYS.INTERACTIONS, JSON.stringify([]));
                if (!localStorage.getItem(this.KEYS.CLIENTS)) localStorage.setItem(this.KEYS.CLIENTS, JSON.stringify([]));
                if (!localStorage.getItem(this.KEYS.FOLLOWUPS)) localStorage.setItem(this.KEYS.FOLLOWUPS, JSON.stringify([]));
                
                const defaultTemplates = [
                    { id: 'f82397ef-7c92-49b8-9bb5-9df5a36db723', name: 'Month Follow-up', content: 'Hello {client}, hope everything is running smoothly with your project. Just checking in to see if you need any updates, improvements, or support from our side.' },
                    { id: 'dd9c0c11-e3a6-495f-88fd-bbef0bacecfe', name: '15 Days Follow-up', content: 'Hello {client}, hope you are doing well after the recent delivery. We wanted to check if everything is running smoothly since the project completion. If you need any minor updates or assistance, feel free to reach out.' },
                    { id: 'bday', name: 'Birthday Wish', content: 'Happy Birthday {client}! Hope you have a fantastic day ahead.' },
                    { id: 'fu-2m', name: '2 Month Follow-up', content: 'Hi {client}, it has been 2 months since our project for {company} finished. Just wanted to check if everything is running smoothly!' },
                    { id: 'anni', name: 'Anniversary Message', content: 'Happy 1 Year Anniversary {client}! It has been exactly one year since we completed your project. Thank you for your continued trust.' }
                ];
                if (!localStorage.getItem(this.KEYS.TEMPLATES) || JSON.parse(localStorage.getItem(this.KEYS.TEMPLATES)).length < 5) {
                    localStorage.setItem(this.KEYS.TEMPLATES, JSON.stringify(defaultTemplates));
                }

                if (!localStorage.getItem(this.KEYS.CATEGORIES)) {
                    const defaultCats = [
                        { id: 'Education', color: '#10b981' },
                        { id: 'Packaging', color: '#3b82f6' },
                        { id: 'Food Business', color: '#f59e0b' }
                    ];
                    localStorage.setItem(this.KEYS.CATEGORIES, JSON.stringify(defaultCats));
                } else {
                    // Cleanup unwanted categories if they exist (Inbound, Outbound, Referral)
                    let cats = this.load(this.KEYS.CATEGORIES);
                    const unwanted = ['Inbound', 'Outbound', 'Referral'];
                    const filtered = cats.filter(c => !unwanted.includes(c.id));
                    if (filtered.length !== cats.length) {
                        // If we removed something, ensure the 3 required ones exist
                        const required = [
                            { id: 'Education', color: '#10b981' },
                            { id: 'Packaging', color: '#3b82f6' },
                            { id: 'Food Business', color: '#f59e0b' }
                        ];
                        required.forEach(r => {
                            if (!filtered.find(f => f.id === r.id)) filtered.push(r);
                        });
                        this.saveCategories(filtered);
                    }
                }
                this.autoRegisterCategories();
            }
            load(key) { 
                try {
                    return JSON.parse(localStorage.getItem(key) || '[]'); 
                } catch(e) {
                    console.error("Storage load error", key, e);
                    return [];
                }
            }
            save(key, data) { localStorage.setItem(key, JSON.stringify(data)); }
            getLeads() { return this.load(this.KEYS.LEADS); }
            saveLeads(leads) { 
                this.save(this.KEYS.LEADS, leads); 
                this.autoRegisterCategories();
            }
            autoRegisterCategories() {
                const leads = this.getLeads();
                const cats = this.getCategories();
                let changed = false;
                leads.forEach(l => {
                    if (l && l.category) {
                        const cName = String(l.category).trim();
                        if (cName && !cats.some(c => c.id.toLowerCase() === cName.toLowerCase())) {
                            const hue = Math.floor(Math.random() * 360);
                            const randomColor = `hsl(${hue}, 75%, 45%)`;
                            cats.push({ id: cName, color: randomColor });
                            changed = true;
                        }
                    }
                });
                if (changed) {
                    this.saveCategories(cats);
                }
            }
            getTasks() { return this.load(this.KEYS.TASKS); }
            saveTasks(tasks) { this.save(this.KEYS.TASKS, tasks); }
            getInteractions() { return this.load(this.KEYS.INTERACTIONS); }
            getClients() { return this.load(this.KEYS.CLIENTS); }
            getFollowUps() { return this.load(this.KEYS.FOLLOWUPS); }
            getTemplates() { return this.load(this.KEYS.TEMPLATES); }
            getCategories() {
                const stored = this.load(this.KEYS.CATEGORIES);
                if (stored && stored.length > 0) {
                    return stored;
                }
                return [
                    { id: 'Education', color: '#10b981' },
                    { id: 'Packaging', color: '#3b82f6' },
                    { id: 'Food Business', color: '#f59e0b' }
                ];
            }
            saveCategories(cats) { this.save(this.KEYS.CATEGORIES, cats); }
            saveFollowUps(data) { this.save(this.KEYS.FOLLOWUPS, data); }
            saveTemplates(data) { this.save(this.KEYS.TEMPLATES, data); }
            addCategory(cat) { 
                const cats = this.getCategories(); 
                if(!cats.find(c => c.id === cat.id)) {
                    cats.push(cat); 
                    this.saveCategories(cats); 
                }
            }
            addInteraction(interaction) {
                if (!interaction.id) {
                    interaction.id = 'INT-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
                }
                const ints = this.getInteractions(); ints.push(interaction); this.save(this.KEYS.INTERACTIONS, ints);
                const leads = this.getLeads(); const lead = leads.find(l => l.id === interaction.leadId);
                if (lead) { 
                    lead.lastInteraction = interaction.timestamp; 
                    lead.interactionCount = ints.filter(i => i.leadId === lead.id).length;
                    const leadInts = ints.filter(i => i.leadId === lead.id).sort((a,b) => b.timestamp - a.timestamp);
                    lead.lastNote = leadInts.find(i => i.type === 'Note')?.content || '';
                    this.saveLeads(leads); 
                    autoSync();
                }
            }
            addLead(lead) { 
                const leads = this.getLeads(); 
                leads.push(lead); 
                this.saveLeads(leads); 
                autoSync();
            }
            deleteLead(id) { 
                const leads = this.getLeads().filter(l => l.id !== id); 
                this.saveLeads(leads); 
                autoSync();
            }
            createClient(lead) {
                const clients = this.load(this.KEYS.CLIENTS); 
                if (clients.find(c => c.leadId === lead.id)) return;
                
                const client = { 
                    ...lead, // Copy all lead data (full row copy)
                    id: lead.id, // Match the ID
                    stages: [
                        { name: "Question Stage", date: "", completed: false },
                        { name: "Requirement Gathering Stage", date: "", completed: false },
                        { name: "Development Stage", date: "", completed: false },
                        { name: "Delivery Stage", date: "", completed: false },
                        { name: "Payment & Activation Stage", date: "", completed: false },
                        { name: "Aftercare & Retention Stage", date: "", completed: false }
                    ],
                    crmStatus: 'Active',
                    convertedAt: Date.now()
                };
                clients.push(client);
                this.save(this.KEYS.CLIENTS, clients);
                autoSync();
            }
        }

        async function fetchLeadsFromSheets(silent = false) {
            if (!GAS_DEPLOY_URL || GAS_DEPLOY_URL.includes("PASTE_YOUR")) return;
            const icon = document.getElementById('sync-icon');
            if(icon && !silent) icon.classList.add('sync-spin');
            
            try {
                // 1. Sync Leads
                const leadRes = await fetch(GAS_DEPLOY_URL + "?sheet=Leads");
                const leads = JSON.parse(await leadRes.text());
                if (Array.isArray(leads)) db.saveLeads(leads);

                // 2. Sync CRM (Clients)
                const clientRes = await fetch(GAS_DEPLOY_URL + "?sheet=CRM");
                const cloudClients = JSON.parse(await clientRes.text());
                if (Array.isArray(cloudClients)) {
                    const restoredClients = cloudClients.map(unflattenClient);
                    db.save(db.KEYS.CLIENTS, restoredClients);
                }

                // Sync Interactions
                try {
                    const intRes = await fetch(GAS_DEPLOY_URL + "?sheet=Interactions");
                    const ints = JSON.parse(await intRes.text());
                    if (Array.isArray(ints)) db.save(db.KEYS.INTERACTIONS, ints);
                } catch(e) {}

                // 3. Sync FollowUps (Optional/Internal)
                try {
                    const fuRes = await fetch(GAS_DEPLOY_URL + "?sheet=FollowUps");
                    const fus = JSON.parse(await fuRes.text());
                    if (Array.isArray(fus)) db.saveFollowUps(fus);
                } catch(e) {}

                // 4. Sync Templates (Optional/Internal)
                try {
                    const tRes = await fetch(GAS_DEPLOY_URL + "?sheet=Templates");
                    const ts = JSON.parse(await tRes.text());
                    if (Array.isArray(ts)) db.saveTemplates(ts);
                } catch(e) {}

                if (!silent) alert(`Sync Successful!`);
                handleRoute(); 
            } catch (e) {
                console.error("Cloud Sync Error:", e);
                if (!silent) alert("Sync partially completed or failed. Check connection.");
            } finally {
                if(icon && !silent) icon.classList.remove('sync-spin');
            }
        }

        function unflattenClient(c) {
            const stages = [];
            for (let i = 1; i <= 6; i++) {
                if (c[`stage_${i}_name`]) {
                    stages.push({
                        name: c[`stage_${i}_name`],
                        date: c[`stage_${i}_date`] || "",
                        completed: String(c[`stage_${i}_completed`]).toLowerCase() === 'true'
                    });
                }
            }
            if (stages.length === 0) {
                // Default stages fallback
                return { ...c, stages: [
                    { name: "Question Stage", date: "", completed: false },
                    { name: "Requirement Gathering Stage", date: "", completed: false },
                    { name: "Development Stage", date: "", completed: false },
                    { name: "Delivery Stage", date: "", completed: false },
                    { name: "Payment & Activation Stage", date: "", completed: false },
                    { name: "Aftercare & Retention Stage", date: "", completed: false }
                ]};
            }
            return { ...c, stages };
        }

        let syncTimeout = null;
        function autoSync() {
            if (syncTimeout) clearTimeout(syncTimeout);
            syncTimeout = setTimeout(() => {
                syncLeadsToSheets(true);
            }, 3000); // 3 second delay to batch rapid changes
        }

        async function syncLeadsToSheets(silent = false) {
            if (!GAS_DEPLOY_URL || GAS_DEPLOY_URL.includes("PASTE_YOUR")) return;
            const icon = document.getElementById('sync-icon');
            if(icon && !silent) icon.classList.add('sync-spin');
            try {
                const leads = db.getLeads();
                const interactions = db.getInteractions();
                const leadData = leads.map(l => {
                    const leadInts = interactions.filter(i => i.leadId === l.id).sort((a,b) => b.timestamp - a.timestamp);
                    const lastNote = leadInts.find(i => i.type === 'Note')?.content || '';
                    const todayStart = new Date().setHours(0,0,0,0);
                    const interactionCountToday = leadInts.filter(i => i.timestamp >= todayStart).length;
                    return { 
                        ...l, 
                        interactionCount: leadInts.length, 
                        interactionCountToday: interactionCountToday,
                        lastNote 
                    };
                });
                
                // Batch all syncs
                await Promise.all([
                    fetch(GAS_DEPLOY_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ sheetName: "Leads", data: leadData }) }),
                    fetch(GAS_DEPLOY_URL, { 
                        method: 'POST', 
                        mode: 'no-cors', 
                        body: JSON.stringify({ 
                            sheetName: "CRM", 
                            data: db.getClients().map(c => {
                                const flat = { ...c };
                                delete flat.stages;
                                c.stages.forEach((s, i) => {
                                    flat[`stage_${i+1}_name`] = s.name;
                                    flat[`stage_${i+1}_date`] = s.date;
                                    flat[`stage_${i+1}_completed`] = s.completed;
                                });
                                return flat;
                            }) 
                        }) 
                    }),
                    fetch(GAS_DEPLOY_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ sheetName: "FollowUps", data: db.getFollowUps() }) }),
                    fetch(GAS_DEPLOY_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ sheetName: "Templates", data: db.getTemplates() }) }),
                    fetch(GAS_DEPLOY_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ sheetName: "Interactions", data: db.getInteractions() }) })
                ]);
                
                if (!silent) alert("Production Sync Complete!");
            } catch (e) { 
                console.error(e); 
                if (!silent) alert("Sync Failed."); 
            }
            finally { if(icon && !silent) icon.classList.remove('sync-spin'); }
        }

        // Horizontal Scroll for Kanban (Mobile Auto-Slide)
        let isDraggingLead = false;
        let currentTouchX = 0;
        function checkAutoSlide() {
            if (!isDraggingLead) return;
            const board = document.getElementById('kanban-board');
            if (!board) return;
            
            const viewportWidth = window.innerWidth;
            const threshold = 85; // Wider threshold for better mobile edge detection
            let scrollAmount = 0;

            if (currentTouchX > (viewportWidth - threshold)) {
                scrollAmount = 12; // Faster scroll
            } else if (currentTouchX < threshold && currentTouchX > 0) {
                scrollAmount = -12;
            }

            if (scrollAmount !== 0) {
                board.scrollLeft += scrollAmount;
            }
            requestAnimationFrame(checkAutoSlide);
        }
        window.addEventListener('touchmove', (e) => {
            if (isDraggingLead && e.touches[0]) currentTouchX = e.touches[0].clientX;
        }, { passive: true });
        window.addEventListener('mousemove', (e) => {
            if (isDraggingLead) currentTouchX = e.clientX;
        });

        function quickNote(id) {
            openLeadModal(id);
            setTimeout(() => {
                const noteIn = document.getElementById('note-in');
                if(noteIn) {
                    noteIn.focus();
                    noteIn.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, 300);
        }

        function initSortable() {
            try {
                if (typeof Sortable === 'undefined') return;
                document.querySelectorAll('.kanban-col').forEach(col => {
                    new Sortable(col, {
                        group: 'leads', animation: 200, handle: '.drag-handle', forceFallback: true,
                        onStart: (evt) => {
                            isDraggingLead = true;
                            document.body.classList.add('dragging-active');
                            const board = document.getElementById('kanban-board');
                            if(board) {
                                board.classList.add('no-snap');
                                board.style.scrollSnapType = 'none';
                            }
                            requestAnimationFrame(checkAutoSlide);
                        },
                        onEnd: (evt) => {
                            isDraggingLead = false;
                            document.body.classList.remove('dragging-active');
                            const board = document.getElementById('kanban-board');
                            if(board) {
                                board.classList.remove('no-snap');
                                board.style.scrollSnapType = 'x mandatory';
                            }
                            const next = evt.to.dataset.status; const prev = evt.from.dataset.status; const id = evt.item.dataset.id;
                            if (next !== prev) {
                                const ls = db.getLeads(); const l = ls.find(x => x.id === id);
                                if(l) { 
                                    l.status = next; db.saveLeads(ls); 
                                    db.addInteraction({ id: crypto.randomUUID(), leadId: id, type: 'Note', content: `Moved ${prev} -> ${next}`, timestamp: Date.now() }); 
                                    if(next === LeadStatus.WON) {
                                        db.createClient(l); 
                                        db.addInteraction({ id: crypto.randomUUID(), leadId: id, type: 'Note', content: `Converted to CRM Client`, timestamp: Date.now() }); 
                                    }
                                    autoSync();
                                    renderLeads();
                                }
                            }
                        }
                    });
                });
            } catch(e) { console.error("Sortable init error", e); }
        }

        function updateVerticalBar(client) {
            const bar = document.getElementById('vertical-progress');
            if(!bar) return;
            const completedCount = client.stages.filter(s => s.completed).length;
            const pct = completedCount > 0 ? (completedCount / 6) * 100 : 0;
            bar.style.height = `calc(${pct}% - 8px)`;
            
            const today = new Date().setHours(0,0,0,0);
            const isAnyLate = client.stages.some(s => !s.completed && s.date && new Date(s.date) < today);
            if(isAnyLate) {
                bar.classList.remove('bg-emerald-500');
                bar.classList.add('bg-red-500');
            } else {
                bar.classList.remove('bg-red-500');
                bar.classList.add('bg-emerald-500');
            }
        }

        function toggleStageCompletion(clientId, stageIdx) {
            const cs = db.getClients();
            const c = cs.find(x => x.id === clientId);
            if(c) {
                const wasCompleted = c.stages[stageIdx].completed;
                c.stages[stageIdx].completed = !wasCompleted;
                
                // If the last stage is now completed and wasn't before
                if (stageIdx === 5 && c.stages[stageIdx].completed && !wasCompleted) {
                    c.projectCompletedAt = Date.now();

        function renderRetention() {
            try {
                const followups = db.getFollowUps();
                const today = new Date().setHours(0,0,0,0);
                
                const isCompleted = (val) => {
                    if (val === undefined || val === null) return false;
                    if (typeof val === 'boolean') return val;
                    const s = String(val).toLowerCase().trim();
                    return s === 'true';
                };

                const parseSafeDate = (d) => {
                    if (!d) return 0;
                    if (typeof d === 'number') return d;
                    const parsedNum = Number(d);
                    if (!isNaN(parsedNum)) return parsedNum;
                    
                    const ts = Date.parse(d);
                    if (!isNaN(ts)) return ts;
                    
                    const parts = String(d).split('/');
                    if (parts.length === 3) {
                        const day = parseInt(parts[0], 10);
                        const month = parseInt(parts[1], 10) - 1;
                        const year = parseInt(parts[2], 10);
                        const dateObj = new Date(year, month, day);
                        if (!isNaN(dateObj.getTime())) return dateObj.getTime();
                    }
                    return 0;
                };

                const overdue = followups.filter(f => !isCompleted(f.completed) && parseSafeDate(f.date) < today).sort((a,b) => parseSafeDate(a.date) - parseSafeDate(b.date));
                const todayF = followups.filter(f => !isCompleted(f.completed) && new Date(parseSafeDate(f.date)).setHours(0,0,0,0) === today);

        function processSendWhatsApp(clientId, encodedMsg, clientNameFallback = '') {
            const clients = db.getClients();
            const leads = db.getLeads();
            let l = clients.find(x => x.id === clientId) || leads.find(x => x.id === clientId);
            
            if (!l && clientNameFallback) {
                l = clients.find(x => x.name === decodeURIComponent(clientNameFallback)) || leads.find(x => x.name === decodeURIComponent(clientNameFallback));
            }

            let phoneStr = l ? String(l.phone || '') : '';
            if (!phoneStr || phoneStr.trim() === '') {
                const nameDisplay = l ? l.name : (clientNameFallback ? decodeURIComponent(clientNameFallback) : "Client");
                const userPhone = prompt(`Please enter a WhatsApp/phone number for ${nameDisplay}:`, "");
                if (userPhone) {
                    phoneStr = userPhone;
                    // If we found a local client/lead, let's update their phone number in the database so it's auto-detected next time!
                    if (l) {
                        l.phone = phoneStr;
                        if (clients.some(x => x.id === l.id)) {
                            db.save(db.KEYS.CLIENTS, clients);
                        } else if (leads.some(x => x.id === l.id)) {
                            db.saveLeads(leads);
                        }
                        autoSync();
                    }
                } else {
                    return; // user cancelled
                }
            }

            const rawPhone = phoneStr.replace(/\D/g, '');
            const waPhone = rawPhone.length === 10 ? '91' + rawPhone : rawPhone;
            
            const waUrl = `https://wa.me/${waPhone}?text=${encodedMsg}`;
            window.open(waUrl, '_blank');
            if (l) {
                logAction(l.id, 'WhatsApp');
            }
            closeModal('lead-modal');
        }

        function handleLeadUpdate(e, id) {
            e.preventDefault();
            const fd = new FormData(e.target);
            const ls = db.getLeads();
            const idx = ls.findIndex(x => x.id === id);
            if(idx === -1) return;
            
            const oldStatus = ls[idx].status;
            const newStatus = fd.get('status');

            ls[idx] = { 
                ...ls[idx], 
                name: fd.get('name'), 
                company: fd.get('company'), 
                category: fd.get('category'), 
                status: newStatus,
                phone: fd.get('phone'),
                email: fd.get('email'),
                birthday: fd.get('birthday'),
                extraNotes: fd.get('extraNotes')
            };
            
            db.saveLeads(ls);

            // Propagate to Clients if exists
            const clients = db.getClients();
            const cIdx = clients.findIndex(c => c.id === id);
            if (cIdx !== -1) {
                clients[cIdx] = {
                    ...clients[cIdx],
                    name: ls[idx].name,
                    company: ls[idx].company,
                    phone: ls[idx].phone,
                    email: ls[idx].email,
                    birthday: ls[idx].birthday,
                    extraNotes: ls[idx].extraNotes
                };
                db.save(db.KEYS.CLIENTS, clients);
            }

            if(oldStatus !== newStatus) {
                db.addInteraction({ id: crypto.randomUUID(), leadId: id, type: 'Note', content: `Status changed from ${oldStatus} to ${newStatus}`, timestamp: Date.now() });
                if(newStatus === LeadStatus.WON) db.createClient(ls[idx]);
            } else {
                db.addInteraction({ id: crypto.randomUUID(), leadId: id, type: 'Note', content: `Profile updated`, timestamp: Date.now() });
            }
            
            autoSync();
            
            // If we are currently viewing this as a client profile, stay in that view
            if (cIdx !== -1 && currentClientId === id) {
                renderClientProfile();
            } else {
                renderLeadModalContent();
            }
            renderLeads();
            if (location.hash === '#clients') renderClients();
        }

        async function sendFollowUpWhatsApp(id) {
            const ls = db.getLeads();
            const l = ls.find(x => x.id === id);
            if(!l) return;
            
            const msgArea = document.getElementById(`fu-msg-${l.id}`);
            const msg = msgArea ? msgArea.value.trim() : (l.followUpMsg || '');
            
            // Save the message content

            const phoneStr = String(l.phone || '');
            const rawPhone = phoneStr.replace(/\D/g, '');
            const waPhone = rawPhone.length === 10 ? '91' + rawPhone : rawPhone;
            
            const encodedMsg = encodeURIComponent(msg);

            logAction(id, 'WhatsApp');

            autoSync();

            if (!val) return;

            addAgentMsg(val, true);

            setTimeout(() => {
                if (jerryState.step === 'awaiting_name') {

                    jerryState.step = 'awaiting_phone';

        function formatDateYYYYMMDD(date) {
            const yyyy = date.getFullYear();
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            return `${yyyy}-${mm}-${dd}`;
        }

                } else if (searchType === 'fu_find_by_phone') {

                } else if (searchType === 'fu_find_by_company') {
                    matchedLeads = leads.filter(l => (l.company || '').toLowerCase().includes(query));

                if (matchedLeads.length === 0) {

        function handleJerryFollowUp(actionId, label) {
            addAgentMsg(label, true);

            setTimeout(() => {
                if (actionId === 'fu_opt_cancel') {
                    addAgentMsg(`Follow-up scheduling cancelled.`);
                    jerryState.step = 'idle';
                    resetAgentOptions();
                    return;
                }

                if (jerryState.step === 'fu_start') {
                    if (actionId === 'fu_opt_find') {
                        jerryState.step = 'fu_find_lead_type';
                        addAgentMsg(`How would you like to find the lead?`);
                        renderJerryStepOptions();
                    } else if (actionId === 'fu_opt_stage') {
                        jerryState.step = 'fu_browse_stage';
                        addAgentMsg(`Which stage would you like to browse?`);
                        renderJerryStepOptions();
                    } else if (actionId === 'fu_opt_recent') {
                        const leads = db.getLeads().sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0)).slice(0, 5);
                        if (leads.length === 0) {
                            addAgentMsg(`No leads found. Please create a lead first.`);
                            jerryState.step = 'fu_start';
                            renderJerryStepOptions();
                        } else {
                            jerryState.step = 'fu_recent_leads';
                            addAgentMsg(`Select a recent lead.`);
                            renderJerryStepOptions();
                        }
                    }
                    return;
                }

                if (jerryState.step === 'fu_find_lead_type') {
                    jerryState.data.followup_find_type = actionId;
                    jerryState.step = 'fu_enter_search';
                    addAgentMsg(`Enter your search.`);
                    renderJerryStepOptions();
                    return;
                }

                if (jerryState.step === 'fu_browse_stage') {
                    if (actionId.startsWith('fu_stage_')) {
                        const stageName = actionId.replace('fu_stage_', '');
                        let matchedStatus = LeadStatus.NEW;
                        const stageLower = stageName.toLowerCase();
                        if (stageLower.includes('new')) matchedStatus = LeadStatus.NEW;
                        else if (stageLower.includes('contacted')) matchedStatus = LeadStatus.CONTACTED;
                        else if (stageLower.includes('follow')) matchedStatus = LeadStatus.FOLLOW_UP;
                        else if (stageLower.includes('interest')) matchedStatus = LeadStatus.INTERESTED;
                        else if (stageLower.includes('won')) matchedStatus = LeadStatus.WON;
                        else if (stageLower.includes('lost')) matchedStatus = LeadStatus.LOST;

                        const leadsInStage = db.getLeads().filter(l => l.status === matchedStatus);
                        jerryState.data.leads_in_stage = leadsInStage;
                        jerryState.data.view_more_limit = 3;

                        jerryState.step = 'fu_select_lead_by_stage';
                        addAgentMsg(`I found ${leadsInStage.length} ${matchedStatus} leads.`);
                        renderJerryStepOptions();
                    }
                    return;
                }

                if (actionId === 'fu_view_more_stage') {
                    jerryState.data.view_more_limit = (jerryState.data.view_more_limit || 3) + 5;
                    renderJerryStepOptions();
                    return;
                }

                if (actionId.startsWith('select_lead_')) {
                    const leadId = actionId.replace('select_lead_', '');
                    const lead = db.getLeads().find(l => l.id === leadId);
                    if (lead) {
                        jerryState.data.followup_lead_id = lead.id;
                        jerryState.data.followup_lead_name = lead.name;
                        jerryState.data.followup_lead_company = lead.company || '';
                        jerryState.data.followup_lead_status = lead.status || '';

                        jerryState.step = 'fu_remind_time';
                        addAgentMsg(`You selected:<br><br>👤 ${lead.name}<br>🏢 ${lead.company || 'Private Entity'}<br>📌 ${lead.status}<br><br>When should I remind you?`);
                        renderJerryStepOptions();
                    }
                    return;
                }

                if (jerryState.step === 'fu_remind_time') {
                    if (actionId.startsWith('remind_')) {
                        const type = actionId.replace('remind_', '');
                        if (type === 'tomorrow') {
                            jerryState.data.followup_remind_time = 'Tomorrow';
                            const d = new Date(); d.setDate(d.getDate() + 1);
                            jerryState.data.followup_remind_date_val = formatDateYYYYMMDD(d);
                        } else if (type === '3days') {
                            jerryState.data.followup_remind_time = 'In 3 Days';
                            const d = new Date(); d.setDate(d.getDate() + 3);
                            jerryState.data.followup_remind_date_val = formatDateYYYYMMDD(d);
                        } else if (type === 'nextweek') {
                            jerryState.data.followup_remind_time = 'Next Week';
                            const d = new Date(); d.setDate(d.getDate() + 7);
                            jerryState.data.followup_remind_date_val = formatDateYYYYMMDD(d);
                        } else if (type === 'pickdate') {
                            jerryState.step = 'fu_remind_pickdate_input';
                            addAgentMsg(`Please pick a date:`);
                            renderJerryStepOptions();
                            return;
                        }

                        jerryState.step = 'fu_message_choice';
                        addAgentMsg(`Would you like to add a reminder message?`);
                        renderJerryStepOptions();
                    }
                    return;
                }

                if (jerryState.step === 'fu_message_choice') {
                    if (actionId === 'msg_skip') {
                        jerryState.data.followup_message = '—';
                        jerryState.step = 'fu_confirm_create';
                        
                        const summaryHtml = `
👤 Lead: ${jerryState.data.followup_lead_name}<br>
🏢 Company: ${jerryState.data.followup_lead_company || '—'}<br>
📅 Reminder: ${jerryState.data.followup_remind_time}<br>
📝 Message: —
                        `.trim();

                        addAgentMsg(`Please confirm your follow-up.<br><br>${summaryHtml}`);
                        renderJerryStepOptions();
                    } else if (actionId === 'msg_add') {
                        jerryState.step = 'fu_message_input';
                        addAgentMsg(`Enter your reminder message.`);
                        renderJerryStepOptions();
                    }
                    return;
                }

                if (jerryState.step === 'fu_confirm_create') {
                    if (actionId === 'fu_confirm_yes') {
                        const leads = db.getLeads();
                        const lead = leads.find(l => l.id === jerryState.data.followup_lead_id);
                        if (lead) {
                            lead.status = LeadStatus.FOLLOW_UP;
                            lead.followUpDate = jerryState.data.followup_remind_date_val;
                            lead.followUpMsg = jerryState.data.followup_message === '—' ? '' : jerryState.data.followup_message;
                            db.saveLeads(leads);
                            
                            db.addInteraction({
                                id: crypto.randomUUID(),
                                leadId: lead.id,
                                type: 'Note',
                                content: `Scheduled follow-up on ${jerryState.data.followup_remind_time}. Message: ${jerryState.data.followup_message}`,
                                timestamp: Date.now()
                            });

                            renderLeads();
                            renderDashboard();
                            autoSync();
                        }

                        addAgentMsg(`✅ Follow-up created successfully`);
                        jerryState.step = 'wizard_finished';
                        renderJerryStepOptions();
                    } else if (actionId === 'fu_confirm_edit') {
                        jerryState.step = 'fu_start';
                        addAgentMsg(`Let's start over to configure follow-up.`);
                        renderJerryStepOptions();
                    }
                    return;
                }
            }, 500);
        }

                if(id === 'sum') {
                    const leads = db.getLeads();
                    r = `You currently have ${leads.length} total leads in your pipeline.`;
                }
                else if(id === 'new') {
                    const count = db.getLeads().filter(x=>x.status===LeadStatus.NEW).length;
                    r = `There are ${count} leads in 'New' status waiting for contact.`;
                }
                else if(id === 'sync') {
                    r = "Initiating cloud pull... I'll update the list as soon as data arrives.";
                    fetchLeadsFromSheets(false);
                }
                else if(id === 'over') {
                    const overdue = db.getTasks().filter(t => !t.isCompleted && new Date(t.dueDate) < new Date());
                    r = overdue.length ? `You have ${overdue.length} overdue tasks that need attention.` : "No overdue tasks! You're all caught up.";
                }
                addAgentMsg(r);
            }, 600);
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');
            const errorTextEl = document.getElementById('login-error-text');
            const btn = document.getElementById('login-submit-btn');
            
            if (GAS_DEPLOY_URL && !GAS_DEPLOY_URL.includes("PASTE_YOUR")) {
                btn.disabled = true;
                btn.innerHTML = `<span class="sync-spin"><i data-lucide="refresh-cw" class="w-4 h-4"></i></span> <span>Authenticating...</span>`;
                if (typeof lucide !== 'undefined') lucide.createIcons();
                
                try {
                    const url = `${GAS_DEPLOY_URL}?action=login&email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`;
                    const response = await fetch(url);
                    const result = await response.json();
                    
                    if (result.success && result.user) {
                        localStorage.setItem('currentUser', JSON.stringify(result.user));
                        errorEl.classList.add('hidden');
                        checkLogin();
                        handleRoute();
                        setTimeout(() => fetchLeadsFromSheets(true), 500);
                    } else {
                        errorTextEl.innerText = result.error || 'Invalid email or password';
                        errorEl.classList.remove('hidden');
                    }
                } catch (error) {
                    console.error("Login verification failed", error);
                    errorTextEl.innerText = "Connection failed. Checking local credentials bypass...";
                    errorEl.classList.remove('hidden');
                    
                    // Offline fallback: check locally
                    if (email === 'admin@solocrm.com' && password === 'admin123') {
                        const demoUser = { name: "Admin User", email: "admin@solocrm.com", role: "Administrator" };
                        localStorage.setItem('currentUser', JSON.stringify(demoUser));
                        errorEl.classList.add('hidden');
                        checkLogin();
                        handleRoute();
                        setTimeout(() => fetchLeadsFromSheets(true), 500);
                    }
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = `<span>Sign In</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>`;
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                }
            } else {
                if (email === 'admin@solocrm.com' && password === 'admin123') {
                    const demoUser = { name: "Admin User", email: "admin@solocrm.com", role: "Administrator" };
                    localStorage.setItem('currentUser', JSON.stringify(demoUser));
                    errorEl.classList.add('hidden');
                    checkLogin();
                    handleRoute();
                } else {
                    errorTextEl.innerText = "Demo login: admin@solocrm.com / admin123";
                    errorEl.classList.remove('hidden');
                }
            }
        }

        async function handleLogout() {
            const userJson = localStorage.getItem('currentUser');
            if (userJson) {
                const user = JSON.parse(userJson);
                if (GAS_DEPLOY_URL && !GAS_DEPLOY_URL.includes("PASTE_YOUR")) {
                    try {
                        await fetch(`${GAS_DEPLOY_URL}?action=logout&email=${encodeURIComponent(user.email)}`, { mode: 'no-cors' });
                    } catch (e) {
                        console.error("Logout log failed", e);
                    }
                }
            }
            localStorage.removeItem('currentUser');
            closeModal('profile-modal');
            checkLogin();
        }

        function updateUserProfileUI() {
            try {
                const userJson = localStorage.getItem('currentUser');
                if (userJson) {
                    const user = JSON.parse(userJson);
                    
                    const dName = document.getElementById('profile-name-text');
                    const dRole = document.getElementById('profile-role-text');
                    if (dName) dName.innerText = user.name || 'User';
                    if (dRole) dRole.innerText = user.role || 'User';
                    
                    const mName = document.getElementById('profile-name-text-mobile');
                    const mRole = document.getElementById('profile-role-text-mobile');
                    if (mName) mName.innerText = user.name || 'User';
                    if (mRole) mRole.innerText = user.role || 'User';
                    
                    const modalName = document.getElementById('modal-profile-name');
                    const modalRole = document.getElementById('modal-profile-role');
                    const modalEmail = document.getElementById('modal-profile-email');
                    if (modalName) modalName.innerText = user.name || 'User';
                    if (modalRole) modalRole.innerText = user.role || 'User';
                    if (modalEmail) modalEmail.innerText = user.email || '';
                }
            } catch (e) {
                console.error("Failed to update user profile UI", e);
            }
        }

        function triggerRecordingUpload(leadId, interactionId) {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'audio/*';
            input.onchange = (e) => {
                if (e.target.files.length > 0) {
                    uploadRecordingToDrive(leadId, interactionId, e.target.files[0]);
                }
            };
            input.click();
        }

        async function uploadRecordingToDrive(leadId, interactionId, file) {
            const l = db.getLeads().find(x => x.id === leadId);
            if (!l) return;
            
            const clientName = (l.name || 'Lead').replace(/[^a-zA-Z0-9]/g, '_');
            const status = (l.status || 'New').replace(/[^a-zA-Z0-9]/g, '_');
            
            // Format timestamp: DD-MM-YYYY_HH-mm-ss
            const now = new Date();
            const pad = (num) => String(num).padStart(2, '0');
            const dateStr = `${pad(now.getDate())}-${pad(now.getMonth()+1)}-${now.getFullYear()}`;
            const timeStr = `${pad(now.getHours())}-${pad(now.getMinutes())}-${pad(now.getSeconds())}`;
            const timestamp = `${dateStr}_${timeStr}`;
            
            // File extension
            const ext = file.name.split('.').pop() || 'mp3';
            const newFileName = `${clientName}_${status}_${timestamp}.${ext}`;
            
            // Show progress bar
            const container = document.getElementById(`upload-container-${interactionId}`);
            const progress = document.getElementById(`progress-container-${interactionId}`);
            const progressText = document.getElementById(`progress-text-${interactionId}`);
            const progressBar = document.getElementById(`progress-bar-${interactionId}`);
            
            if (container && progress) {
                container.classList.add('hidden');
                progress.classList.remove('hidden');
            }
            
            if (progressBar && progressText) {
                progressBar.style.width = '20%';
                progressText.innerText = '20%';
            }

            // Read file as base64
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const dataUrl = e.target.result;
                    const base64Data = dataUrl.split(',')[1];
                    
                    if (progressBar && progressText) {
                        progressBar.style.width = '60%';
                        progressText.innerText = '60%';
                    }
                    
                    if (!GAS_DEPLOY_URL || GAS_DEPLOY_URL.includes("PASTE_YOUR")) {
                        console.warn("GAS_DEPLOY_URL not set, simulating offline upload");
                        setTimeout(() => {
                            if (progressBar && progressText) {
                                progressBar.style.width = '100%';
                                progressText.innerText = '100%';
                            }
                            
                            // Save locally as simulation
                            const ints = db.getInteractions();
                            const targetInt = ints.find(x => x.id === interactionId);
                            if (targetInt) {
                                targetInt.audioUrl = '#';
                                targetInt.audioName = newFileName;
                                db.save(db.KEYS.INTERACTIONS, ints);
                                renderLeadModalContent();
                                autoSync();
                            }
                        }, 800);
                        return;
                    }
                    
                    const payload = {
                        action: 'uploadAudio',
                        clientName: l.name || 'Lead',
                        status: l.status || 'New',
                        fileName: newFileName,
                        mimeType: file.type || 'audio/mpeg',
                        fileData: base64Data
                    };
                    
                    const response = await fetch(GAS_DEPLOY_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                    
                    const responseText = await response.text();
                    let result;
                    try {
                        result = JSON.parse(responseText);
                    } catch (parseErr) {
                        console.error("Failed to parse GAS response as JSON. Response text:", responseText);
                        throw new Error(responseText || "Empty or invalid response from server");
                    }
                    
                    if (result.success && (result.downloadUrl || result.url)) {
                        if (progressBar && progressText) {
                            progressBar.style.width = '100%';
                            progressText.innerText = '100%';
                        }
                        
                        // Save in database
                        const ints = db.getInteractions();
                        const targetInt = ints.find(x => x.id === interactionId);
                        if (targetInt) {
                            targetInt.audioUrl = result.downloadUrl || result.url;
                            targetInt.audioName = newFileName;
                            db.save(db.KEYS.INTERACTIONS, ints);
                            
                            // Re-render
                            renderLeadModalContent();
                            autoSync();
                        }
                    } else {
                        alert("Upload failed: " + (result.error || "Unknown server error"));
                        if (container && progress) {
                            container.classList.remove('hidden');
                            progress.classList.add('hidden');
                        }
                    }
                } catch (err) {
                    console.error("Upload error details:", err);
                    alert("Upload error: " + err.message + ". Saving offline fallback recording.");
                    
                    const ints = db.getInteractions();
                    const targetInt = ints.find(x => x.id === interactionId);
                    if (targetInt) {
                        targetInt.audioUrl = '#';
                        targetInt.audioName = newFileName;
                        db.save(db.KEYS.INTERACTIONS, ints);
                        renderLeadModalContent();
                        autoSync();
                    }
                }
            };
            
            reader.readAsDataURL(file);
        }

        resetAgentOptions();
    </script>
</body>
